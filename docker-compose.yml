services:
  postgres:
    image: postgres:17
    restart: always
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - expense_analyst_network
  grafana:
    image: grafana/grafana
    ports:
      - "3000:3000"
    depends_on:
      - postgres
    volumes:
      - grafana_data:/var/lib/grafana
    networks:
      - expense_analyst_network
  streamlit:
    depends_on:
      - postgres
    build: .
    ports:
      - "8501:8501"
    environment:
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_HOST=${POSTGRES_HOST}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    volumes:
      - expense_analyst:/var/opt
    networks:
      - expense_analyst_network
networks:
  expense_analyst_network:
    driver: bridge

volumes:
  pgdata:
    driver: local
  grafana_data:
    driver: local
  expense_analyst:
    driver: local


