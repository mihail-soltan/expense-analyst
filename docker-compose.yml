services:
  pg_service:
    build:
      dockerfile: pg.Dockerfile
    restart: always
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - expense_analyst_network
  backend:
    build:
      context: .
      dockerfile: ./backend/Dockerfile
    ports:
      - "8000:8000"
    depends_on:
      - pg_service
    environment:
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_DB=${POSTGRES_DB}
    networks:
      - expense_analyst_network
  grafana:
    image: grafana/grafana
    ports:
      - "3000:3000"
    depends_on:
      - pg_service
    volumes:
      - grafana_data:/var/lib/grafana
    networks:
      - expense_analyst_network
networks:
  expense_analyst_network:
    driver: bridge

volumes:
  pgdata:
    driver: local
  grafana_data:
    driver: local
  expense_analyst:
    driver: local


